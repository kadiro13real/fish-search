<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@600&display=swap" rel="stylesheet">

    <title>Malindi Fishing</title>
    <style>
      body {
  font-family: "Roboto", sans-serif;
  font-optical-sizing: auto;
  font-weight: 600;
  font-style: normal;
  font-variation-settings:
    "wdth" 100;
}




        .buttonb {
  background: rgb(59, 62, 63);
  color: white;
  border: 1px solid;
  padding: 5px;
  display: block;
  text-decoration: none;
  width: auto;
  text-align: center;
  display: block;
  margin-right: 20;
  
  direction: ltr;
  text-align: left;
  margin-top: 0%;
  }
  a{
  text-decoration: none;
 color: white;
}
        .back{
  margin: 0%;
  padding: 0%;
  border: 0px;
}


.title
        {
            text-align: center;
            background-color: rgb(45, 139, 232);
            color: white;
            margin: 0%;
        }

        .all
        {
            margin: 0%;
        }
        .current
        {
            font-size: 34pt;
            margin-top: 0%;
            text-align: center;
        }
        .subheading
        {
            margin-bottom: 0%;
            text-align: center;
        }
        .category
        {
            border: 3px solid  rgb(59, 62, 63);
            margin: 5px;
        }
        .cat_heading
        {
            text-align: center;
            margin-top: 0%;
        }
        .center-img { 
          display: block; 
          margin-left: auto; 
          margin-right: auto; 
        }









    </style>
</head>
<body>
    <div style="position: relative; width:100%; height: 200px;">
      <img class="back" src="{{ url_for('static', filename='images/backround.png') }}" style="width: 100%; height: 100%;" alt="Background image">
      <a id="link" href="https://fishing-website.onrender.com/index.html"><img src="{{ url_for('static', filename='images/logo.png') }}" style="position: absolute; top: 0px; bottom: 50px; left: 50px; width: 400px; height: 200px;" alt="Overlay image"></a>
    </div>
    
    
    <ul style="display: flex;">
        <li class="buttonb"><a id="link" href="https://fishing-website.onrender.com/index.html">Home</a>
        </li>
        <li class="buttonb"><a id="link" href="https://fishing-website.onrender.com/aquascape.html">Aqua Scape</a></li>
        <li class="buttonb"><a id="link" href="https://fishing-website.onrender.com/fishes.html">Fishes List</a></li>
        <li class="buttonb"><a id="link" href="https://fishing-website.onrender.com/info.html">Information</a></li>
        <li class="buttonb"><a id="link" href="/">Fish Search</a></li>
  
    </ul>
  <h1 class="title">FISH SEARCH BY MALINDI FISHING 1.0</h1>
  <div class="category">
    <h2 class="cat_heading">Search a fish</h2>
    <form method="GET" action="/" class="cat_heading">
	  <input name="fish" type="text" placeholder="Enter fish species"><br>
	  <input name="Submit" type="submit">
    </form>
  </div>
  <h2 class="cat_heading">Results of the search</h2>
  <div class="category">
    <h2 class="cat_heading">{{fish}}</h2>
    <img src={{img}} alt="fish image" class="center-img">
    <p class="cat_heading">{{descripiton}}</p>
    <div class="category">
      <h2 class="cat_heading">Fish Location</h2>
      <img src={{map_url}} alt="map image" class="center-img">
      <p>note: the 50 most common locations ther may be other locations</p>
      <p>note: the darker blue map pin is an error</p>
    </div>
  </div>

  


  
</body>
</html>
